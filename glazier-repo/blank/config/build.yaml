templates:
  osdcloud:
    PSCommand: ['Start-OSDCloud -Firmware -SkipAutopilot -SkipODT -ZTI -OSVersion "Windows 11" -OSBuild "25H2" -OSEdition "Pro" -OSLanguage "en-gb" -OSLicense "Retail"']

controls:
- SetTimer: ['winpe_start']

#################################################################################################
# Install Windows                                                                               #
#################################################################################################

- template:
  - 'osdcloud'

#################################################################################################
# Install bootloader                                                                            #
#################################################################################################

- PSCommand: ['& X:\Windows\System32\bcdboot.exe C:\Windows /c /v']

#################################################################################################
# Pre-install cumulative updates                                                                #
#################################################################################################

- pull:
  - ['https://storage.googleapis.com/a1comms-glazier-config/common/updates/install_latest_cu.py', 'C:\glazier_cache\install_latest_cu.py']

- Execute:
  - ['X:\Python\python.exe C:\glazier_cache\install_latest_cu.py', [0], [], False, False]

#################################################################################################
# Copy files from WinPE to the host for later use                                               #
#################################################################################################

- MkDir: ['C:\glazier_cache']

#################################################################################################
# Stage Wi-Fi profiles for Windows Setup / OOBE                                                #
#################################################################################################

- pull:
  - ['https://storage.googleapis.com/a1comms-glazier-config/common/stage_wifi_profiles.ps1', 'C:\glazier_cache\stage_wifi_profiles.ps1']

- PSScript: ['C:\glazier_cache\stage_wifi_profiles.ps1']

- BuildInfoDump: []

- SetTimer: ['winpe_stop']

#################################################################################################
# Exit WinPE                                                                                    #
#################################################################################################
- ExitWinPE: []
